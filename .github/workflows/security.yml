name: Security and build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Non-production fixture: no Firebase credentials or live service writes.
      NEXT_PUBLIC_APIKEY: AIzaSySecurityTestKey0000000000000000000
      NEXT_PUBLIC_AUTHDOMAIN: demo-gy-security.firebaseapp.com
      NEXT_PUBLIC_PROJECTID: demo-gy-security
      NEXT_PUBLIC_STORAGEBUCKET: demo-gy-security.appspot.com
      NEXT_PUBLIC_MESSAGINGSENDERID: '123456789'
      NEXT_PUBLIC_APPID: '1:123456789:web:securitytest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            public/package-lock.json
      - run: npm ci --prefix src
      - run: npm ci --prefix public
      - run: npm test --prefix src
      - run: npm run lint --prefix src
      - run: npm run audit --prefix src
      - run: npm run audit --prefix public
      - run: npm run build --prefix src
      - run: npm run typecheck --prefix src
      - run: npm run build --prefix public
      - name: Audit application runtime dependencies without exceptions
        run: npm audit --prefix src --omit=dev --audit-level=low
